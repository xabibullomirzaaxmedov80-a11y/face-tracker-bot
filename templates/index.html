<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceGuard — Yuz Tanish Tizimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto;
        }

        /* Background animated grid */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Glow blobs */
        .blob {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
        }
        .blob1 { width:400px; height:400px; background: rgba(124,58,237,0.12); top:-100px; left:-100px; }
        .blob2 { width:350px; height:350px; background: rgba(16,185,129,0.08); bottom:-80px; right:-80px; }

        /* ── HEADER ── */
        .header {
            text-align: center; margin-bottom: 24px; position: relative; z-index: 1;
        }
        .logo-row {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 6px;
        }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; box-shadow: 0 0 20px rgba(124,58,237,0.4);
        }
        h1 { font-size: 1.9rem; font-weight: 800; }
        h1 span { background: linear-gradient(135deg, #7c3aed, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #64748b; font-size: 0.88rem; }

        /* ── MAIN CARD ── */
        .card {
            background: #13131a;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            padding: 24px;
            width: 100%; max-width: 700px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative; z-index: 1;
        }

        /* ── VIDEO AREA ── */
        .video-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #0a0a0f;
            aspect-ratio: 1/1; /* 1:1 To'rtburchak (kvadrat) */
            width: 100%;
            max-width: 480px; /* Juda kattalashib ketmasligi uchun */
            margin: 0 auto;
            border: 1px solid rgba(124,58,237,0.2);
            box-shadow: 0 0 30px rgba(124,58,237,0.1) inset;
        }
        #videoElement {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transform: scaleX(-1); /* Selfie mirror */
        }
        #overlayCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; /* Bu yuz ramkasi buzilib, kengayib ketmasligi uchun majburiy */
        }

        /* Scanning corner decorations */
        .video-wrapper::before, .video-wrapper::after {
            content: ''; position: absolute;
            width: 20px; height: 20px;
            border-color: rgba(124,58,237,0.5);
            border-style: solid;
            z-index: 5; pointer-events: none;
        }
        .video-wrapper::before { top: 10px; left: 10px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
        .video-wrapper::after  { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

        /* Status bar (Yuzni to'smasligi uchun videodan tashqariga chiqarildi) */
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(10,10,15,0.75);
            padding: 10px 14px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.9rem; font-weight: 500;
            margin-bottom: 12px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #374151; flex-shrink: 0;
            transition: background 0.3s;
        }
        .dot.active {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 4px #10b981; }
            50% { box-shadow: 0 0 12px #10b981; }
        }

        /* No camera placeholder */
        .no-cam {
            position: absolute; inset: 0; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; color: #374151;
        }
        .no-cam .icon { font-size: 3rem; opacity: 0.4; }
        .no-cam p { font-size: 0.9rem; text-align: center; padding: 0 10px; }

        /* ── RESULT PILL ── */
        .result-pill {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: rgba(10,10,15,0.85);
            padding: 12px 20px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 12px;
            min-height: 60px; /* Joy sakramasi uchun */
            transition: opacity 0.3s;
        }
        .result-pill.hidden { opacity: 0; pointer-events: none; }
        #cameraPersonName {
            font-weight: 700; font-size: 1.1rem;
            background: linear-gradient(135deg, #7c3aed, #10b981);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #vectorNormText { font-size: 0.8rem; color: #64748b; }

        /* ── CONTROLS ── */
        .controls {
            display: flex; gap: 12px; margin-top: 16px;
        }
        .btn {
            flex: 1; padding: 13px; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-weight: 600;
            font-size: 0.95rem; cursor: pointer; border: none;
            transition: all 0.25s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-start {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white; box-shadow: 0 4px 20px rgba(124,58,237,0.35);
        }
        .btn-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,58,237,0.5); }
        .btn-stop {
            background: rgba(239,68,68,0.12); color: #ef4444;
            border: 1px solid rgba(239,68,68,0.25);
        }
        .btn-stop:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

        /* Admin link */
        .admin-link {
            text-align: center; margin-top: 16px;
            font-size: 0.82rem; color: #374151;
        }
        .admin-link a { color: #7c3aed; text-decoration: none; font-weight: 500; }
        .admin-link a:hover { text-decoration: underline; }

        /* Voice indicator */
        .voice-indicator {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25);
            color: #10b981; padding: 5px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600; margin-top: 12px;
        }
        .voice-wave {
            display: flex; align-items: center; gap: 2px; height: 14px;
        }
        .voice-wave span {
            display: block; width: 2px; background: #10b981; border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }
        .voice-wave span:nth-child(1) { height: 6px;  animation-delay: 0s; }
        .voice-wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
        .voice-wave span:nth-child(3) { height: 8px;  animation-delay: 0.2s; }
        .voice-wave span:nth-child(4) { height: 14px; animation-delay: 0.15s; }
        .voice-wave span:nth-child(5) { height: 6px;  animation-delay: 0.05s; }
        @keyframes wave {
            0%,100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        .footer-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .card { padding: 16px; border-radius: 16px; width: 100%; max-width: 100%; }
            .header { margin-bottom: 16px; }
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.8rem; }
            .controls { flex-direction: column; gap: 8px; }
            .btn { padding: 12px; }
            .status-bar { font-size: 0.75rem; padding: 4px 10px; }
            .footer-row { flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
            .blob1 { width: 250px; height: 250px; }
            .blob2 { width: 200px; height: 200px; }
            #cameraPersonName { font-size: 0.9rem; }
            .result-pill { min-width: 150px; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="header">
        <div class="logo-row">
            <div class="logo-icon">🛡️</div>
            <h1>Face<span>Guard</span></h1>
        </div>
        <p class="subtitle">Real vaqtda yuz tanish · Ovozli bildirishnoma · Telegram integratsiya</p>
    </div>

    <div class="card">
        <!-- Status bar -->
        <div class="status-bar">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Kutilmoqda...</span>
        </div>

        <div class="video-wrapper">
            <!-- No camera placeholder -->
            <div class="no-cam" id="noCamPlaceholder">
                <div class="icon">📷</div>
                <p>Kamerani yoqish uchun tugmani bosing</p>
            </div>

            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
        </div>

        <!-- Result pill -->
        <div class="result-pill hidden" id="cameraResult">
            <span>👤</span>
            <div>
                <div id="cameraPersonName">—</div>
                <div id="vectorNormText"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startButton" onclick="startCamera()">
                📷 Kamerani Yoqish
            </button>
            <button class="btn btn-stop" id="stopButton" onclick="stopCamera()" disabled>
                ⏹ To'xtatish
            </button>
        </div>

        <div class="footer-row" style="margin-top:14px;">
            <button class="btn btn-primary" onclick="window.location='/admin'" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 16px;">
                ⚙️ Admin Panel
            </button>
            <button class="btn btn-danger" onclick="logout()" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 10px 16px;">
                🚪 Chiqish
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=17"></script>
    <script>
        // Kamera yoqilganda placeholder-ni yashirish
        document.getElementById('startButton').addEventListener('click', () => {
            document.getElementById('noCamPlaceholder').style.display = 'none';
        });
        document.getElementById('stopButton').addEventListener('click', () => {
            document.getElementById('noCamPlaceholder').style.display = 'flex';
        });

        async function logout() {
            if(confirm("Tizimdan chiqishni xohlaysizmi?")) {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.reload();
            }
        }
    </script>
</body>
</html>
